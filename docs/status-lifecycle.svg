<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Session status lifecycle</title>
  <desc id="desc">Flow diagram of session states active, silent, done, and error based on activity and completion markers.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#97a191"/></marker></defs>
  <rect width="1200" height="360" fill="#0c100d"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">
    <g>
      <rect x="80" y="120" width="220" height="110" rx="12" fill="#131713" stroke="#3fb950"/>
      <text x="190" y="165" font-size="34" fill="#7ee787">●</text><text x="190" y="200" font-size="21" fill="#d6dccd">active</text>
    </g>
    <g>
      <rect x="360" y="120" width="220" height="110" rx="12" fill="#131713" stroke="#f0b85e"/>
      <text x="470" y="165" font-size="34" fill="#f0b85e">~</text><text x="470" y="200" font-size="21" fill="#d6dccd">silent</text>
    </g>
    <g>
      <rect x="640" y="120" width="220" height="110" rx="12" fill="#131713" stroke="#8b949e"/>
      <text x="750" y="165" font-size="34" fill="#8b949e">✓</text><text x="750" y="200" font-size="21" fill="#d6dccd">done</text>
    </g>
    <g>
      <rect x="920" y="120" width="220" height="110" rx="12" fill="#131713" stroke="#ff8485"/>
      <text x="1030" y="165" font-size="34" fill="#ff8485">✗</text><text x="1030" y="200" font-size="21" fill="#d6dccd">error</text>
    </g>
    <g fill="#97a191" font-size="16">
      <line x1="300" y1="155" x2="360" y2="155" stroke="#97a191" stroke-width="2" marker-end="url(#arr)"/>
      <text x="330" y="145">quiet ≥ 20s</text>
      <line x1="580" y1="195" x2="300" y2="195" stroke="#97a191" stroke-width="2" marker-end="url(#arr)"/>
      <text x="440" y="218">new output</text>
      <line x1="580" y1="155" x2="640" y2="155" stroke="#97a191" stroke-width="2" marker-end="url(#arr)"/>
      <text x="610" y="145">CLAUDE_TASK_COMPLETE:0</text>
      <line x1="580" y1="195" x2="920" y2="195" stroke="#97a191" stroke-width="2" marker-end="url(#arr)"/>
      <text x="750" y="218">CLAUDE_TASK_COMPLETE:1+</text>
    </g>
  </g>
</svg>
