# tmux/jt.conf — source from ~/.tmux.conf
#
# Quick status popup (Ctrl+B a)
bind-key a display-popup -E -w 52 -h 24 "jt popup"

# Sidebar toggle (Ctrl+B A)
bind-key A run-shell "jt sidebar toggle"

# Per-pane status borders driven by jtd. The daemon writes the per-pane
# @jt_status_fg user option as sessions transition between active /
# silent / done / error; the format strings below re-render the border
# to match.
#
# When @jt_status_fg is not set on a pane (e.g. main, or any pane jtd
# hasn't claimed), fall back to whatever pane-border-style was already
# in effect when this file was sourced. Capturing the user's existing
# style — instead of hardcoding our own — keeps a custom
# ~/.tmux.conf border preference intact.
#
# Override the captured fallback by setting these user options after
# this file is sourced:
#   set -g @jt_default_border_fg        "fg=red"
#   set -g @jt_default_active_border_fg "fg=cyan"
set -gqF @jt_default_border_fg        "#{E:pane-border-style}"
set -gqF @jt_default_active_border_fg "#{E:pane-active-border-style}"

set -g pane-border-style        "#{?#{@jt_status_fg},fg=#{@jt_status_fg},#{@jt_default_border_fg}}"
set -g pane-active-border-style "#{?#{@jt_status_fg},fg=#{@jt_status_fg},#{@jt_default_active_border_fg}}"
